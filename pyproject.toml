[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prevol"
version = "0.5.0"
description = "Audit the declarations that a computational result carries, and check they are still true."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Brieuc de La Fournière" }]
keywords = [
    "reproducibility", "provenance", "research-software", "scientific-computing",
    "verification", "audit", "negative-controls", "computer-assisted-proof",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Arithmon/Prevol"
Changelog = "https://github.com/Arithmon/Prevol/blob/main/CHANGELOG.md"

[project.scripts]
prevol = "prevol.cli:main"

[tool.setuptools]
packages = ["prevol"]
